<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Cosmic Clash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  {"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
  </script>
  <script src="https://unpkg.com/playroomkit/dist/playroomkit.js"></script>
  <script type="module" src="./network.js"></script>
  <script type="module" src="./main.js"></script>
</head>
<body class="bg-transparent m-0 p-0 overflow-hidden select-none">
  <canvas id="game-canvas" style="position: absolute; top: 0; left: 0; z-index: 1; width: 100vw; height: 100vh; display: block;"></canvas>

  <div id="master-ui" class="flex flex-col items-center justify-center h-screen w-screen bg-transparent pointer-events-none" style="position: absolute; top: 0; left: 0; z-index: 10;">
    <div class="flex flex-col items-center justify-center max-w-sm w-full px-6 py-8">
      
      <!-- 1. The "Cosmic Clash" Title -->
      <header class="text-center mb-10 pointer-events-auto">
        <p class="text-amber-400 font-serif text-xs md:text-sm tracking-[0.4em] uppercase opacity-85 mb-2 drop-shadow">A Realm Between Worlds</p>
        <h1 class="text-4xl sm:text-5xl md:text-6xl font-bold font-serif text-amber-100 tracking-wider drop-shadow-[0_4px_24px_rgba(245,158,11,0.5)] whitespace-nowrap">Cosmic Clash</h1>
        <div class="w-40 sm:w-56 h-0.5 mx-auto mt-4 bg-gradient-to-r from-transparent via-amber-400 to-transparent"></div>
      </header>

      <!-- 2. "Host Game" button -->
      <button id="btn-host" data-direct-action="true" type="button" class="w-full py-4 mb-4 bg-gradient-to-r from-amber-800 via-amber-600 to-amber-800 hover:from-amber-700 hover:to-amber-500 text-amber-100 font-serif font-bold text-lg sm:text-xl rounded-xl border border-amber-400/60 shadow-[0_6px_25px_rgba(0,0,0,0.7)] hover:shadow-[0_0_30px_rgba(245,158,11,0.5)] transition-all transform hover:scale-[1.03] active:scale-[0.97] pointer-events-auto cursor-pointer" onclick="window.hostMatch()">
        Host Game
      </button>

      <!-- 3. "Join Game" section (input field + button) -->
      <div class="join-section w-full p-4 mb-4 rounded-xl bg-stone-900/85 border border-amber-600/40 backdrop-blur-md shadow-2xl flex flex-col items-center pointer-events-auto">
        <label for="roomCode" class="text-amber-300 font-serif text-xs font-semibold uppercase tracking-[0.25em] mb-2.5">
          Join Game
        </label>
        <div class="flex gap-2.5 w-full">
          <input id="roomCode" name="roomCode" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="CODE" class="flex-1 bg-stone-800/90 text-amber-200 border border-amber-600/50 rounded-lg px-3 py-2 text-center font-serif text-lg tracking-widest uppercase placeholder-stone-500 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400/50 pointer-events-auto" />
          <button id="btn-join" data-direct-action="true" type="button" class="px-5 py-2 bg-gradient-to-r from-amber-700 to-amber-600 hover:from-amber-600 hover:to-amber-500 text-amber-100 font-serif font-bold text-base rounded-lg border border-amber-400/50 shadow transition-all transform hover:scale-105 active:scale-95 pointer-events-auto cursor-pointer" onclick="window.joinMatch(document.getElementById('roomCode').value.trim())">
            Join
          </button>
        </div>
      </div>

      <!-- 4. "Settings" button at the bottom -->
      <button id="btn-settings" type="button" class="w-full py-3 bg-stone-900/80 hover:bg-stone-800 text-amber-300/90 hover:text-amber-100 font-serif text-sm tracking-widest uppercase rounded-lg border border-amber-800/40 hover:border-amber-500/60 shadow-lg transition-all transform hover:scale-[1.02] active:scale-[0.98] pointer-events-auto cursor-pointer" onclick="window.openSettings()">
        Settings
      </button>

    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm pointer-events-auto" style="display: none;">
      <div class="relative w-full max-w-sm p-6 mx-4 rounded-2xl bg-stone-900/95 border-2 border-amber-600/70 shadow-2xl font-serif text-amber-100 pointer-events-auto">
        <button type="button" class="absolute top-4 right-4 text-stone-400 hover:text-amber-300 text-2xl font-bold leading-none cursor-pointer" onclick="window.closeSettings()">&times;</button>
        <h3 class="text-2xl font-bold text-amber-300 mb-6 text-center tracking-wide">Settings</h3>
        
        <div class="mb-5">
          <div class="flex justify-between items-center mb-1 text-sm text-amber-200">
            <span>Mouse Sensitivity</span>
            <span id="sens-value">1.0x</span>
          </div>
          <input id="setting-sensitivity" type="range" min="0.2" max="2.5" step="0.1" value="1.0" class="w-full accent-amber-500 cursor-pointer pointer-events-auto" oninput="window.setMouseSensitivity(this.value)" />
        </div>

        <div class="mb-6">
          <div class="flex justify-between items-center mb-1 text-sm text-amber-200">
            <span>Master Volume</span>
            <span id="vol-value">80%</span>
          </div>
          <input id="setting-volume" type="range" min="0" max="100" step="5" value="80" class="w-full accent-amber-500 cursor-pointer pointer-events-auto" oninput="document.getElementById('vol-value').textContent = this.value + '%'" />
        </div>

        <button type="button" class="w-full py-2.5 bg-gradient-to-r from-amber-700 to-amber-600 hover:from-amber-600 hover:to-amber-500 text-amber-100 font-bold rounded-lg border border-amber-400/50 shadow transition-all cursor-pointer pointer-events-auto" onclick="window.closeSettings()">
          Done
        </button>
      </div>
    </div>
  </div>

  <!-- 3D Quaternius Card Selection HUD Prompt -->
  <div id="character-select-ui" class="fixed inset-0 z-50 flex flex-col justify-between items-center pointer-events-none p-6 sm:p-8" style="display: none;">
    <!-- Top Header -->
    <header class="text-center pointer-events-auto mt-4 bg-stone-950/70 border border-amber-600/40 backdrop-blur-md px-8 py-4 rounded-2xl shadow-[0_8px_30px_rgba(0,0,0,0.8)]">
      <p class="text-amber-400 font-serif text-xs md:text-sm tracking-[0.35em] uppercase mb-1 drop-shadow">Roundtable Hold Summoning</p>
      <h2 class="text-2xl sm:text-3xl md:text-4xl font-bold font-serif text-amber-100 tracking-wider drop-shadow-[0_2px_15px_rgba(245,158,11,0.5)]">Choose Your Champion</h2>
      <div class="w-36 h-0.5 mx-auto mt-2 bg-gradient-to-r from-transparent via-amber-400/80 to-transparent"></div>
    </header>

    <!-- Close button for live switching via [C] -->
    <button type="button" id="close-character-select-btn" class="absolute top-6 right-8 text-stone-400 hover:text-amber-300 text-3xl font-serif font-bold leading-none cursor-pointer transition-colors pointer-events-auto bg-stone-900/80 hover:bg-stone-800 p-2 rounded-xl border border-amber-600/40" onclick="window.closeCharacterSelect()" title="Close">&times;</button>

    <!-- Bottom Footer Hint -->
    <footer class="mb-4 text-center pointer-events-auto bg-stone-950/70 border border-amber-600/30 backdrop-blur-md px-6 py-2.5 rounded-xl text-xs font-serif text-stone-300 shadow-xl">
      <span>Click any <strong class="text-amber-300">3D Card</strong> to summon champion · Press <kbd class="px-2 py-0.5 bg-stone-800 rounded border border-stone-600 text-amber-300 font-mono">[Alt]</kbd> to unlock cursor · <kbd class="px-2 py-0.5 bg-stone-800 rounded border border-stone-600 text-amber-300 font-mono">[C]</kbd> to switch</span>
    </footer>
  </div>

  <div id="hud" hidden><div class="hud-chip" id="hud-class"></div><div class="hp-wrap"><div id="hp-fill"></div><span id="hp-text">100</span></div><div class="hud-chip" id="hud-state"></div></div>
  <div id="mobile-controls" hidden><div id="joystick-move" class="joystick" aria-hidden="true"><div class="joystick-base"></div><div class="joystick-knob"></div></div><div id="skill-cluster"><button type="button" id="btn-primary" class="skill-btn">ATK</button><button type="button" id="btn-skill1" class="skill-btn">Q</button><button type="button" id="btn-skill2" class="skill-btn">E</button></div><div id="joystick-aim" class="joystick" aria-hidden="true"><div class="joystick-base"></div><div class="joystick-knob"></div></div></div>
</body>
</html>
