<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Cosmic Clash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  {"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
  </script>
  <script src="https://unpkg.com/playroomkit/dist/playroomkit.js"></script>
  <script type="module" src="./network.js"></script>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <div id="master-ui">
    <div id="lobby" class="pointer-events-none">
      <header class="cosmic-title-wrap">
        <p class="cosmic-kicker">A realm between worlds</p>
        <h1 class="cosmic-title">Cosmic Clash</h1>
        <span class="cosmic-title-rule" aria-hidden="true"></span>
      </header>

      <section id="class-select" class="class-wheel" aria-label="Choose your class">
        <p class="wheel-label">Choose your champion</p>
        <div class="wheel-arc" aria-hidden="true"></div>
        <button type="button" class="class-card class-card--rogue selected" data-class="rogue" onclick="window.selectClass('rogue')"><span>Rogue</span><small>Shadowstep</small></button>
        <button type="button" class="class-card class-card--sorcerer" data-class="sorcerer" onclick="window.selectClass('sorcerer')"><span>Sorcerer</span><small>Arcane force</small></button>
        <button type="button" class="class-card class-card--druid" data-class="druid" onclick="window.selectClass('druid')"><span>Druid</span><small>Wild growth</small></button>
        <button type="button" class="class-card class-card--paladin" data-class="paladin" onclick="window.selectClass('paladin')"><span>Paladin</span><small>Oathbound</small></button>
        <div class="wheel-center-mark" aria-hidden="true">✦</div>
      </section>

      <button type="button" class="start-button pointer-events-auto" onclick="window.openServerBrowser(); document.getElementById('server-browser').hidden = false; document.getElementById('roomCode').focus();">
        <span class="start-button__halo" aria-hidden="true"></span>
        <span class="start-button__label">Start</span>
        <span class="start-button__sub">Enter the arena</span>
      </button>

      <div id="team-select" class="legacy-select" aria-hidden="true"><button class="team-btn selected" data-team="0" type="button">Red</button><button class="team-btn" data-team="1" type="button">Blue</button></div>
      <div id="map-select" class="legacy-select" aria-hidden="true"><button class="map-btn selected" data-map="Desert Ruins" type="button">Desert</button></div>
    </div>

    <div id="server-browser" class="server-browser" hidden role="dialog" aria-modal="true" aria-labelledby="server-browser-title">
      <div class="parchment-scroll">
        <button type="button" class="scroll-close" aria-label="Close server browser" onclick="window.closeServerBrowser(); document.getElementById('server-browser').hidden = true;">×</button>
        <p class="parchment-eyebrow">The Astral Gate</p>
        <h2 id="server-browser-title">Server Browser</h2>
        <div class="parchment-divider" aria-hidden="true">✦</div>
        <button id="btn-host" data-direct-action="true" type="button" class="parchment-action" onclick="window.hostMatch()">Host Game</button>
        <div class="join-section">
          <label for="roomCode">Join Game</label>
          <div class="join-row">
            <input id="roomCode" name="roomCode" type="text" maxlength="4" inputmode="text" spellcheck="false" autocomplete="off" autocapitalize="characters" placeholder="ABCD" aria-label="Four character room code" />
            <button id="btn-join" data-direct-action="true" type="button" class="parchment-action parchment-action--join" onclick="window.joinMatch(document.getElementById('roomCode').value)">Join</button>
          </div>
        </div>
        <p id="server-browser-hint">Speak the four-letter sigil to cross the veil.</p>
      </div>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>
  <div id="hud" hidden><div class="hud-chip" id="hud-room"></div><div class="hud-chip" id="hud-players"></div><div class="hud-chip" id="hud-class"></div><div class="hp-wrap"><div id="hp-fill"></div><span id="hp-text">100</span></div><div class="hud-chip" id="hud-state"></div></div>
  <div id="mobile-controls" hidden><div id="joystick-move" class="joystick" aria-hidden="true"><div class="joystick-base"></div><div class="joystick-knob"></div></div><div id="skill-cluster"><button type="button" id="btn-primary" class="skill-btn">ATK</button><button type="button" id="btn-skill1" class="skill-btn">Q</button><button type="button" id="btn-skill2" class="skill-btn">E</button></div><div id="joystick-aim" class="joystick" aria-hidden="true"><div class="joystick-base"></div><div class="joystick-knob"></div></div></div>
  <div id="win-loss-overlay" class="overlay-hidden" aria-hidden="true"><div class="banner-stage"><div class="banner-rigging"><div class="banner-finial finial-left"></div><div class="banner-pole"></div><div class="banner-finial finial-right"></div><div class="banner-cord cord-left"></div><div class="banner-cord cord-right"></div></div><div class="hanging-banner" id="outcome-banner"><div class="banner-cloth-pattern"></div><div class="banner-heraldry"><div class="banner-crest-icon"></div></div><div class="banner-content"><h2 id="banner-title">YOU WIN</h2><p id="banner-subtitle">Glory to the Realm</p><button id="btn-banner-action" type="button">Battle Again</button></div><div class="tattered-burn-marks"></div><div class="fire-particles" id="fire-particles"><span class="fire-tongue ft-1"></span><span class="fire-tongue ft-2"></span><span class="fire-tongue ft-3"></span><span class="fire-tongue ft-4"></span><span class="fire-tongue ft-5"></span><span class="fire-tongue ft-6"></span><span class="fire-ember fe-1"></span><span class="fire-ember fe-2"></span><span class="fire-ember fe-3"></span><span class="fire-ember fe-4"></span><span class="fire-ember fe-5"></span><span class="fire-ember fe-6"></span></div></div></div></div>
</body>
</html>
